[build-system]
requires = ['setuptools >= 64']   # >=62.3 for recursive (**) package-data globs
build-backend = 'setuptools.build_meta'

[project]
name = 'fastsurfer-lean'
version = '2.6.0-dev0+lean1'
description = 'fastsurfer-lean: FastSurfer VINN whole-brain parcellation CNN, slimmed to the inference path (a lean fork of Deep-MI/FastSurfer for medseg/nnseg - not a separate product)'
readme = 'README.md'
license = {file = 'LICENSE'}
requires-python = '>=3.10'
authors = [{name = 'Martin Reuter et al.'}]
maintainers = [{name = 'FastSurfer Developers'}]
keywords = [
    'python',
    'Deep learning',
    'Segmentation',
    'Brain segmentation',
    'Brain analysis',
    'volumetry',
]
classifiers = [
    'Operating System :: Microsoft :: Windows',
    'Operating System :: Unix',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Natural Language :: English',
    'License :: OSI Approved :: Apache Software License',
    'Intended Audience :: Science/Research',
]
# leansurfer: the FastSurferCNN INFERENCE path only. Dropped vs upstream FastSurfer:
# lapy, meshpy (C build), monai, neuroreg, pyrr, torchio, tensorboard, scikit-learn,
# simpleitk - all for surface reconstruction / registration / FastSurfer-CC / training,
# none imported by the whole-brain parcellation CNN. Kept = exactly what
# FastSurferCNN's conform + VINN get_prediction + label maps import.
dependencies = [
    'h5py>=3.7',
    'matplotlib>=3.7.1',
    'nibabel>=5.4.0',
    'numpy>=1.25',
    'packaging',
    'pandas>=1.5.3',
    'pyyaml>=6.0',
    'requests>=2.31.0',
    'scikit-image>=0.19.3',
    'scipy>=1.10.1,!=1.13.0',
    'torch==2.7.*',
    'torchvision>=0.22.1,<0.23',
    'tqdm>=4.65',
    'yacs>=0.1.8',
]

[project.optional-dependencies]
qc  = [
    'whippersnappy>=2.1',
]
lit = [
    'neurolit>=0.6.1',
]
container = [
    'fastsurfer[qc]',
    'fastsurfer[lit]',
]
doc = [
    'fastsurfer[qc]',
    'furo!=2023.8.17',
    'memory-profiler',
    'myst-parser',
    'numpydoc',
    # sphinx 8 handles importing of files differently in some manner and will cause the
    # build of the doc to fail. This will need to be addressed before we up to sphinx 8.
    'sphinx>=7.3,<8',
    'sphinxcontrib-bibtex',
    'sphinxcontrib-programoutput',
    'sphinx-argparse!=0.6.0', # does not work for -j parallel builds
    'sphinx-copybutton',
    'sphinx-design',
    'sphinx-gallery',
    'sphinx-issues',
    'pypandoc',
    'nbsphinx',
    'IPython', # For syntax highlighting in notebooks
    'ipykernel',
]
style = [
    'bibclean',
    'codespell',
    'pydocstyle[toml]',
    'ruff',
    'ty',
]
quicktest = [
    'pytest>=8.2.2',
]
all = [
    'fastsurfer[doc]',
    'fastsurfer[style]',
    'fastsurfer[qc]',
    'fastsurfer[lit]',
    'fastsurfer[quicktest]',
]
full = [
    'fastsurfer[all]',
]

[project.urls]
homepage = 'https://fastsurfer.org'
documentation = 'https://fastsurfer.org'
source = 'https://github.com/Deep-MI/FastSurfer'
tracker = 'https://github.com/Deep-MI/FastSurfer/issues'

[tool.freesurfer]
version = "7.4.1"
# The following URLs use the {version} placeholder, which should be replaced
# with the actual version string using Python's .format(version=...).
[tool.freesurfer.urls]
linux = "https://surfer.nmr.mgh.harvard.edu/pub/dist/freesurfer/{version}/freesurfer-linux-ubuntu22_amd64-{version}.tar.gz"
macOS = "https://surfer.nmr.mgh.harvard.edu/pub/dist/freesurfer/{version}/freesurfer-macOS-darwin_x86_64-{version}.tar.gz"

# find (auto-discover) so SUBPACKAGES ship - upstream's explicit list omitted
# FastSurferCNN.utils/.data_loader, making `pip install` import-broken. fastsurfer-lean
# ships only FastSurferCNN* (the parcellation CNN); the surface/CC packages are dropped.
[tool.setuptools.packages.find]
include = ['FastSurferCNN*']

# Ship the CNN's DATA files (config/checkpoint_paths.yaml, the VINN cfgs, the color
# LUTs) - `packages` only ships .py, so without this the runtime FileNotFounds on
# checkpoint_paths.yaml. Recursive ** needs setuptools >= 62.3 (pinned above).
[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.yml", "**/*.tsv", "**/*.txt", "**/*.json"]

[tool.pydocstyle]
convention = 'numpy'
ignore-decorators = '(copy_doc|property|.*setter|.*getter|pyqtSlot|Slot)'
match = '^(?!setup|__init__|test_).*\.py'
match-dir = '^FastSurferCNN.*,^CerebNet.*,^recon-surf.*,^HypVINN.*'
add_ignore = 'D100,D104,D107'

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "build",
    "checkpoints",
    "doc",
    "env",
]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "I",   # isort
    # "SIM", # flake8-simplify
    "NPY201",  # numpy 2
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"Tutorial/*.ipynb" = ["E501"]  # exclude "Line too long"
"FastSurferCNN/utils/logging.py" = ["F401"]  # exclude "Imported but unused"
"FastSurferCNN/utils/parser_defaults.py" = ["F401"]  # exclude "Imported but unused"

[tool.pytest.ini_options]
minversion = '6.0'
addopts = '--durations 20 --junit-xml=junit-results.xml --verbose'
filterwarnings = []

[tool.coverage.run]
branch = true
cover_pylib = false
omit = [
    '**/__init__.py',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'if __name__ == .__main__.:',
]
precision = 2
